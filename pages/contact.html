</head>
<body>
    <header>
        <div class="brand-section">
            <h1>THENEO<span>GRID</span></h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About</a></li>

            </ul>
        </nav>
    </header>

    <main style="text-align: center; max-width: 700px;">
        <h2>Connect With the Grid</h2>
        <form action="#" method="post">
            <fieldset>
                <legend>Project Inquiry Form</legend>
                <div class="form-group">
                    <label for="user-name">Full Name</label>
                    <input type="text" id="user-name" name="user-name" required>
                </div>
                <div class="form-group">
                    <label for="project-type">Service Required</label>
                    <select id="project-type" name="project-type">
                        <option value="software">Software Development</option>
                        <option value="security">Cybersecurity Audit</option>
                        <option value="cloud">Cloud Migration</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Project Description</label>
                    <textarea id="message" rows="5"></textarea>
                </div>
                <button type="submit">Initialize Link</button>
            </fieldset>
        </form>
    </main>
